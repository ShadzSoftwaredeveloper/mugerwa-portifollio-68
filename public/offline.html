
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Shadrach Portfolio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 { color: #8B5CF6; margin-bottom: 1rem; }
    p { opacity: 0.8; max-width: 400px; line-height: 1.6; }
    button {
      background: #8B5CF6;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="offline-icon">📱</div>
  <h1>You're Offline</h1>
  <p>Please check your internet connection and try again. Some cached content may still be available.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
